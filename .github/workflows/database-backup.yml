name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
  actions: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Require backup secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }
          test -n "$AGE_RECIPIENT" || { echo "Missing BACKUP_AGE_RECIPIENT secret"; exit 1; }
          test -n "$AGE_IDENTITY" || { echo "Missing BACKUP_AGE_IDENTITY secret"; exit 1; }
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg age
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q " 17\."
      - name: Export public application schema and encrypt immediately
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-acl --format=custom --file=public.dump
          test -s public.dump
          age --encrypt --recipient "$AGE_RECIPIENT" --output khelgrid-public.dump.age public.dump
          rm -f public.dump
          test -s khelgrid-public.dump.age
          sha256sum khelgrid-public.dump.age > khelgrid-public.dump.age.sha256
          # Keep only the age secret-identity line; omit generated comments or accidental labels.
          printf '%s\n' "$AGE_IDENTITY" | tr -d '\r' | grep -E '^AGE-SECRET-KEY-[0-9A-Z]+' > age-identity.txt || {
            echo "BACKUP_AGE_IDENTITY must contain the private line beginning AGE-SECRET-KEY-1; update the GitHub secret from identity.txt without sharing it."
            exit 1
          }
          chmod 600 age-identity.txt
          age --decrypt --identity age-identity.txt khelgrid-public.dump.age >/dev/null
          rm -f age-identity.txt
        shell: bash
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: khelgrid-db-backup-${{ github.run_id }}
          path: |
            khelgrid-public.dump.age
            khelgrid-public.dump.age.sha256
          if-no-files-found: error
          retention-days: 30
